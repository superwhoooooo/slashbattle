<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="0.45" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#9b4dff"/>
      <stop offset="0.55" stop-color="#5a1fc2"/>
      <stop offset="1" stop-color="#22074f"/>
    </radialGradient>
    <radialGradient id="burst" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset="0.6" stop-color="#ffb21a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="body" cx="0.38" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffb08a"/>
      <stop offset="0.45" stop-color="#ff6a4d"/>
      <stop offset="1" stop-color="#d8332a"/>
    </radialGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ff2ff"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#3ff2ff"/>
    </linearGradient>
    <linearGradient id="slash" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#7ff6ff" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- background + burst rays -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(250 270)" fill="#7a35ff" opacity="0.55">
    <path d="M0 0 L-60 -420 L60 -420 Z"/>
    <path d="M0 0 L-60 -420 L60 -420 Z" transform="rotate(40)"/>
    <path d="M0 0 L-60 -420 L60 -420 Z" transform="rotate(80)"/>
    <path d="M0 0 L-60 -420 L60 -420 Z" transform="rotate(120)"/>
    <path d="M0 0 L-60 -420 L60 -420 Z" transform="rotate(160)"/>
    <path d="M0 0 L-60 -420 L60 -420 Z" transform="rotate(200)"/>
    <path d="M0 0 L-60 -420 L60 -420 Z" transform="rotate(240)"/>
    <path d="M0 0 L-60 -420 L60 -420 Z" transform="rotate(280)"/>
    <path d="M0 0 L-60 -420 L60 -420 Z" transform="rotate(320)"/>
  </g>
  <circle cx="250" cy="280" r="230" fill="url(#burst)" opacity="0.75"/>

  <!-- the slash streak behind the hero -->
  <path d="M40 430 Q 210 150 500 70 Q 260 210 70 470 Z" fill="url(#slash)"/>

  <!-- the jelly hero -->
  <path d="M256 128 C 372 128 430 214 430 312 C 430 410 352 462 252 462 C 150 462 78 408 80 312 C 82 212 142 128 256 128 Z"
        fill="url(#body)" stroke="#12112a" stroke-width="16" stroke-linejoin="round"/>
  <ellipse cx="180" cy="196" rx="52" ry="26" fill="#fff" opacity="0.5" transform="rotate(-28 180 196)"/>
  <!-- sword, raised in front: glow, blade, guard, grip -->
  <g transform="rotate(24 404 400)">
    <rect x="380" y="40" width="48" height="320" rx="24" fill="#3ff2ff" filter="url(#glow)" opacity="0.95"/>
    <rect x="385" y="52" width="38" height="300" rx="19" fill="url(#blade)" stroke="#12112a" stroke-width="10"/>
    <rect x="354" y="344" width="100" height="28" rx="14" fill="#ffd23a" stroke="#12112a" stroke-width="10"/>
    <rect x="390" y="368" width="28" height="66" rx="12" fill="#3a2a6e" stroke="#12112a" stroke-width="10"/>
  </g>
  <!-- fist on the sword grip -->
  <circle cx="396" cy="402" r="36" fill="#ff7a55" stroke="#12112a" stroke-width="14"/>

  <!-- googly, mismatched eyes -->
  <circle cx="196" cy="268" r="54" fill="#fff" stroke="#12112a" stroke-width="13"/>
  <circle cx="318" cy="258" r="42" fill="#fff" stroke="#12112a" stroke-width="13"/>
  <circle cx="214" cy="276" r="24" fill="#12112a"/>
  <circle cx="330" cy="262" r="19" fill="#12112a"/>
  <circle cx="222" cy="268" r="7" fill="#fff"/>
  <circle cx="336" cy="255" r="6" fill="#fff"/>
  <!-- angry brows -->
  <path d="M136 196 L 244 222" stroke="#12112a" stroke-width="24" stroke-linecap="round"/>
  <path d="M374 190 L 284 214" stroke="#12112a" stroke-width="24" stroke-linecap="round"/>

  <!-- battle grin -->
  <path d="M176 352 Q 262 340 348 344 Q 336 432 258 432 Q 186 430 176 352 Z" fill="#3a0b1f" stroke="#12112a" stroke-width="13" stroke-linejoin="round"/>
  <path d="M190 360 Q 262 350 334 352 L 330 376 Q 262 372 194 382 Z" fill="#fff"/>
  <path d="M226 418 Q 260 396 296 418 Q 262 432 226 418 Z" fill="#ff5c8a"/>

  <!-- sparkles -->
  <g fill="#ffe066" stroke="#12112a" stroke-width="6" stroke-linejoin="round">
    <path d="M78 96 L 90 124 L 118 136 L 90 148 L 78 176 L 66 148 L 38 136 L 66 124 Z"/>
    <path d="M452 196 L 460 214 L 478 222 L 460 230 L 452 248 L 444 230 L 426 222 L 444 214 Z"/>
    <path d="M110 452 L 117 467 L 132 474 L 117 481 L 110 496 L 103 481 L 88 474 L 103 467 Z"/>
  </g>
</svg>
