<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SlashBattle</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      #app {
        width: 100vw;
        height: 100vh;
      }

      #hud {
        position: fixed;
        top: 16px;
        left: 16px;
        font-family: system-ui, sans-serif;
        font-weight: 900;
        color: #fff;
        text-shadow: 2px 2px 0 #000;
        user-select: none;
      }
      #health-bar {
        width: 220px;
        height: 28px;
        border: 3px solid #000;
        border-radius: 8px;
        background: #3a3a42;
        box-shadow: 2px 2px 0 #000;
        overflow: hidden;
      }
      #health-fill {
        height: 100%;
        width: 100%;
        background: #e3372a;
        transition: width 0.15s ease-out;
      }
      #health-label {
        display: block;
        margin-top: 4px;
        font-size: 14px;
      }
      #monsters-left {
        margin-top: 10px;
        font-size: 16px;
      }
      #hidden-indicator {
        display: none;
        margin-top: 10px;
        font-size: 18px;
        color: #ffe066;
      }
      #hide-prompt {
        display: none;
        margin-top: 10px;
        font-size: 14px;
        color: #cfeaff;
      }

      #ambush-banner {
        display: none;
        position: fixed;
        top: 30%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-family: system-ui, sans-serif;
        font-weight: 900;
        font-size: 48px;
        color: #ff3355;
        text-shadow: 3px 3px 0 #000;
        user-select: none;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div id="health-bar">
        <div id="health-fill"></div>
      </div>
      <span id="health-label">100 / 100</span>
      <div id="monsters-left">Monsters left: 0</div>
      <div id="hidden-indicator">HIDDEN</div>
      <div id="hide-prompt">Press E to hide</div>
    </div>
    <div id="ambush-banner">AMBUSH!</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
